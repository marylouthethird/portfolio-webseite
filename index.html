<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aline Piazza — Storytellerin</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Lora:ital,wght@0,400;1,400&display=swap">
<style>
  :root {
    --color-bg: #f3f2f2;
    --color-text: #201f1d;
    --color-accent: #b68235;
    --color-accent-700: #7d5411;
    --color-divider: color-mix(in srgb, #201f1d 16%, transparent);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--color-bg);
    color: var(--color-text);
    font-family: "Lora", serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }
  main { max-width: 640px; text-align: center; }
  .name {
    font-family: "Cormorant Garamond", serif;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--color-accent-700);
    margin: 0 0 40px;
  }
  h1 {
    font-family: "Cormorant Garamond", serif;
    font-weight: 400;
    font-size: clamp(36px, 7vw, 60px);
    line-height: 1.1;
    letter-spacing: -0.01em;
    margin: 0;
  }
  .en {
    font-style: italic;
    font-size: 17px;
    margin: 20px 0 0;
    color: color-mix(in srgb, var(--color-text) 70%, transparent);
  }
  .rule {
    width: 48px;
    height: 1px;
    border: 0;
    margin: 44px auto;
    background: var(--color-accent);
  }
  a {
    font-size: 15px;
    color: var(--color-accent-700);
    text-underline-offset: 4px;
  }
  a:hover { color: var(--color-accent); }
</style>
</head>
<body>
  <main>
    <p class="name">Aline Piazza</p>
    <h1>Ein neues Kapitel wird gerade geschrieben.</h1>
    <p class="en" lang="en">A new chapter is being written.</p>
    <hr class="rule">
    <a href="mailto:itsalinepiazza@gmail.com">itsalinepiazza@gmail.com</a>
  </main>
</body>
</html>
